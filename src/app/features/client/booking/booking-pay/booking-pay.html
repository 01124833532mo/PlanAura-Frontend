<div class="booking-pay-page">
  <div class="card-luxe luxe-shadow booking-pay-page__card animate-fade-up">
    <span class="material-symbols-outlined booking-pay-page__icon">payments</span>
    <h3 class="text-headline-sm">Checkout is coming soon</h3>
    <p class="text-body-md">
      Payment for booking #{{ bookingId }} isn't available yet — please check back shortly.
    </p>
    <ui-button [fullWidth]="false" (click)="goToBookings()">Back to my bookings</ui-button>
  </div>
</div>
