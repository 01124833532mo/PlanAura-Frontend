<div class="ui-password__row" [class.ui-password__row--compact]="compact">
  @if (label) {
    <label class="ui-field__label" [for]="fieldId">{{ label }}</label>
  }
  <ng-content select="[slot=action]" />
</div>
<div class="ui-password__wrapper">
  <input
    class="ui-field__input"
    [class.ui-field__input--invalid]="!!errorMessage"
    [class.ui-field__input--compact]="compact"
    [id]="fieldId"
    [type]="visible() ? 'text' : 'password'"
    [placeholder]="placeholder"
    [disabled]="disabled"
    [value]="value"
    (input)="handleInput($event)"
    (blur)="handleBlur()"
  />
  <button
    type="button"
    class="ui-password__toggle"
    (click)="toggleVisibility()"
    [attr.aria-label]="visible() ? 'Hide password' : 'Show password'"
  >
    <span class="material-symbols-outlined">{{ visible() ? 'visibility_off' : 'visibility' }}</span>
  </button>
</div>
@if (errorMessage) {
  <p class="ui-field__error">{{ errorMessage }}</p>
}
