@if (label) {
  <label class="ui-field__label" [for]="fieldId">{{ label }}</label>
}
<div
  class="ui-dropzone"
  [class.ui-dropzone--dragging]="dragging()"
  [class.ui-dropzone--invalid]="!!errorMessage"
  (dragover)="handleDragOver($event)"
  (dragleave)="handleDragLeave()"
  (drop)="handleDrop($event)"
>
  <input
    class="ui-dropzone__input"
    [id]="fieldId"
    type="file"
    accept=".png,.jpg,.jpeg"
    [multiple]="multiple"
    [disabled]="disabled"
    (change)="handleFileInput($event)"
  />
  <label [for]="fieldId" class="ui-dropzone__prompt">
    <span class="ui-dropzone__icon-wrap" aria-hidden="true">
      <span class="material-symbols-outlined">upload_file</span>
    </span>
    <span class="ui-dropzone__prompt-body">
      <span class="ui-dropzone__prompt-text">Drag & drop, or click to browse</span>
      <span class="ui-dropzone__hint">{{ hint }}</span>
    </span>
  </label>
</div>

@if (previews.length) {
  <ul class="ui-dropzone__previews">
    @for (preview of previews; track preview.file.name + preview.file.size; let i = $index) {
      <li class="ui-dropzone__preview">
        <img class="ui-dropzone__preview-img" [src]="preview.url" [alt]="preview.file.name" />
        <div class="ui-dropzone__preview-scrim"></div>
        <button
          type="button"
          class="ui-dropzone__preview-remove"
          (click)="removeFile(i)"
          [attr.aria-label]="'Remove ' + preview.file.name"
        >
          <span class="material-symbols-outlined">close</span>
        </button>
        <span class="ui-dropzone__preview-name">{{ preview.file.name }}</span>
      </li>
    }
  </ul>
}

@if (errorMessage) {
  <p class="ui-field__error">{{ errorMessage }}</p>
}
