<div class="admin-modal-backdrop" (click)="handleBackdropClick()">
  <div
    class="admin-modal-card admin-modal-card--wide admin-animate-scale-in"
    role="dialog"
    aria-modal="true"
    (click)="$event.stopPropagation()"
  >
    <div class="admin-modal-card__icon admin-modal-card__icon--danger">
      <span class="material-symbols-outlined" aria-hidden="true">block</span>
    </div>

    <h3 class="admin-modal-card__title">Reject verification</h3>
    @if (vendorName) {
      <p class="admin-modal-card__message">{{ vendorName }}</p>
    }

    @if (error?.message) {
      <p class="admin-modal-card__error">{{ error?.message }}</p>
    }

    <div class="reject-dialog__field">
      <label class="reject-dialog__label" for="rejection-reason">Rejection reason</label>
      <textarea
        id="rejection-reason"
        class="admin-input reject-dialog__textarea"
        rows="4"
        maxlength="500"
        placeholder="Explain why this vendor's verification is being rejected..."
        [(ngModel)]="reason"
        [disabled]="saving"
      ></textarea>
      <p class="reject-dialog__hint">This reason is visible to the vendor.</p>
    </div>

    <div class="admin-modal-card__actions">
      <button type="button" class="admin-btn admin-btn--secondary" [disabled]="saving" (click)="cancelled.emit()">
        Cancel
      </button>
      <button type="button" class="admin-btn admin-btn--danger" [disabled]="!canSubmit" (click)="submit()">
        @if (saving) {
          <span class="admin-spinner"></span>
        }
        Reject vendor
      </button>
    </div>
  </div>
</div>
