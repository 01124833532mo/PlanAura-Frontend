<div class="ui-segmented" role="tablist">
  @for (option of options; track option.value) {
    <button
      type="button"
      role="tab"
      class="ui-segmented__tab"
      [class.ui-segmented__tab--active]="option.value === value"
      [attr.aria-selected]="option.value === value"
      (click)="select(option)"
    >
      {{ option.label }}
    </button>
  }
</div>
