<div class="admin-card admin-chart-card admin-animate-fade-up">
  <div class="admin-chart-card__header">
    <div>
      <h3 class="admin-chart-card__title">{{ title }}</h3>
      @if (subtitle) {
        <p class="admin-chart-card__subtitle">{{ subtitle }}</p>
      }
    </div>
  </div>

  <div class="admin-chart-card__body" [style.height.px]="height">
    @if (loading) {
      <div class="admin-chart-card__loading">
        <span class="admin-spinner admin-spinner--dark"></span>
      </div>
    } @else if (isEmpty) {
      <div class="admin-chart-card__loading">
        <span class="material-symbols-outlined admin-chart-card__empty-icon">bar_chart</span>
        <p>{{ emptyMessage }}</p>
      </div>
    } @else {
      <apx-chart
        [chart]="config.chart"
        [series]="config.series"
        [xaxis]="config.xaxis ?? {}"
        [yaxis]="config.yaxis ?? {}"
        [colors]="config.colors ?? []"
        [labels]="config.labels ?? []"
        [legend]="config.legend ?? { show: true }"
        [stroke]="config.stroke ?? {}"
        [fill]="config.fill ?? {}"
        [dataLabels]="config.dataLabels ?? { enabled: false }"
        [tooltip]="config.tooltip ?? {}"
        [grid]="config.grid ?? {}"
        [plotOptions]="config.plotOptions ?? {}"
      ></apx-chart>
    }
  </div>
</div>
